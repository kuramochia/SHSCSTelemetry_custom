name: Build Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: msbuild SHETS2Telemetry_x64_kuramochia\SHETS2Telemetry_x64_kuramochia.sln /m /p:Configuration=Release /p:Platform=x64
